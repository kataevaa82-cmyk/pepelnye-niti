<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Пепельные нити</title>
  <style>
    *{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10181c;color:#e9decb;font-family:system-ui,sans-serif}
    #frame{position:absolute;inset:0;margin:auto;width:min(100vw,200vh);height:100vh}
    #canvas{width:100%;height:100%;display:block;outline:0}
    #loader{position:fixed;inset:0;display:grid;place-content:center;padding:28px;background:#10181c;text-align:center}
    #loader .mark{color:#91d8b9;font-size:48px;letter-spacing:12px}
    h1{font-size:clamp(28px,5vw,58px);font-weight:600;margin:18px 0}
    #status{color:#baa98d;max-width:600px;line-height:1.6}
    progress{width:min(80vw,420px);height:5px;margin:24px auto;accent-color:#91d8b9}
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="frame"><canvas id="canvas" tabindex="0" aria-label="Пепельные нити"></canvas></div>
  <div id="loader"><div class="mark">◇</div><h1>Пепельные нити</h1><div id="status">В темноте ещё остался свет.</div><progress id="progress" max="1" value="0"></progress></div>
  <script src="bridge.js"></script>
  <script src="$GODOT_URL"></script>
  <script>window.ASH_ENGINE_CONFIG = $GODOT_CONFIG;</script>
  <script src="boot.js"></script>
</body>
</html>
